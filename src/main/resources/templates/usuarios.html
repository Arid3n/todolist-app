<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>
<body>
<nav th:replace="fragments :: navbar (usuario=${usuario})"></nav>

<div class="container mt-3">
    <h2>Usuarios registrados</h2>

    <table class="table">
        <thead>
        <tr>
            <th>Id</th>
            <th>Email</th>
            <th>Descripción</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u: ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <a th:href="@{/registrados/{id}(id=${u.id})}" th:text="Detalles"></a>
            </td>
            <td>
                <!-- Si es administrador, no se puede bloquear -->
                <span th:if="${u.admin}" class="text-muted">Administrador</span>

                <!-- Si no es administrador, mostramos el botón de Bloquear o Desbloquear -->
                <form th:if="${!u.admin}" th:action="@{/registrados/{id}(id=${u.id})}" method="post" style="display:inline;">
                    <button th:if="${!u.bloqueado}" type="submit" class="btn btn-warning btn-sm">
                        Bloquear
                    </button>
                    <button th:if="${u.bloqueado}" type="submit" class="btn btn-success btn-sm">
                        Desbloquear
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments :: javascript"/>
</body>
</html>
