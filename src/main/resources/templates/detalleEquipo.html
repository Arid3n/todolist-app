<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo=${equipo.nombre})"></head>
<body>
<nav th:replace="fragments :: navbar (usuario=${usuario})"></nav>

<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center">
        <h2 th:text="'Equipo: ' + ${equipo.nombre}"></h2>
        <div>
            <form th:if="${usuario != null and !esMiembro}"
                  th:action="@{/equipos/{id}/usuarios(id=${equipo.id})}"
                  method="post" class="d-inline">
                <button type="submit" class="btn btn-success btn-sm">Unirse al equipo</button>
            </form>
            <button type="button" class="btn btn-danger btn-sm"
                    th:if="${usuario != null and esMiembro}"
                    th:data-url="@{/equipos/{idEquipo}/usuarios/{idUsuario}(idEquipo=${equipo.id}, idUsuario=${usuario.id})}"
                    onclick="salirEquipo(this)">
                Salir del equipo
            </button>
            <a th:href="@{/equipos}" class="btn btn-secondary btn-sm ml-2">Volver al listado</a>
        </div>
    </div>

    <h4 class="mt-4">Miembros</h4>
    <table class="table table-bordered mt-2">
        <thead class="table-light">
        <tr>
            <th>Id</th>
            <th>Email</th>
            <th>Nombre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.nombre}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="3" class="text-center text-muted">Este equipo aún no tiene miembros asignados.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments :: javascript"></div>

<script type="text/javascript">
    function salirEquipo(btn) {
        const url = btn.getAttribute('data-url');
        if (confirm('¿Estás seguro/a de que quieres salir del equipo?')) {
            fetch(url, {
                method: 'DELETE'
            }).then(function(res) {
                if (res.ok) {
                    location.reload();
                } else {
                    alert('Error al salir del equipo: ' + res.status);
                }
            }).catch(function(err) {
                console.error('Error en fetch:', err);
            });
        }
    }
</script>

</body>
</html>
