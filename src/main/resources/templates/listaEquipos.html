<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head (titulo='Listado de Equipos')"></head>
<body>
<nav th:replace="fragments :: navbar (usuario=${usuario})"></nav>

<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center">
        <h2>Equipos</h2>
        <a th:if="${usuario != null}" th:href="@{/equipos/nuevo}" class="btn btn-primary btn-sm">Nuevo equipo</a>
    </div>

    <table class="table table-striped mt-3">
        <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipo : ${equipos}">
            <td th:text="${equipo.id}"></td>
            <td>
                <a th:href="@{/equipos/{id}(id=${equipo.id})}" th:text="${equipo.nombre}"></a>
            </td>
            <td>
                <a class="btn btn-primary btn-sm" th:href="@{/equipos/{id}(id=${equipo.id})}">Ver detalle</a>
                <a th:if="${usuario != null and usuario.admin}"
                   class="btn btn-warning btn-sm ml-1"
                   th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
                <button th:if="${usuario != null and usuario.admin}"
                        type="button" class="btn btn-danger btn-sm ml-1"
                        th:data-url="@{/equipos/{id}(id=${equipo.id})}"
                        onclick="borrarEquipo(this)">Borrar</button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(equipos)}">
            <td colspan="3" class="text-center text-muted">No hay equipos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="fragments :: javascript"></div>

<script type="text/javascript">
    function borrarEquipo(btn) {
        const url = btn.getAttribute('data-url');
        if (confirm('¿Estás seguro/a de que quieres borrar este equipo?')) {
            fetch(url, {
                method: 'DELETE'
            }).then(function(res) {
                if (res.ok) {
                    location.reload();
                } else {
                    alert('Error al borrar el equipo: ' + res.status);
                }
            });
        }
    }
</script>

</body>
</html>
